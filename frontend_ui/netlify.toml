[build]
  publish = "."
  command = "echo 'Static build complete. No compilation necessary for Vanilla JS Enterprise OS.'"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"
  CI = "true"

[[redirects]]
  from = "/api/*"
  to = "http://localhost:8000/api/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-From = "Netlify-Proxy"
    X-Proxy-Cache = "BYPASS"

[[redirects]]
  from = "/docs"
  to = "http://localhost:8000/docs"
  status = 200
  force = true

[[redirects]]
  from = "/openapi.json"
  to = "http://localhost:8000/api/v1/openapi.json"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 301
  force = true

[[redirects]]
  from = "/queue"
  to = "/hitl-review.html"
  status = 301
  force = true

[[redirects]]
  from = "/audit"
  to = "/audit-logs.html"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 http://localhost:8080 http://localhost:9000 ws://localhost:8000 ws://localhost:8080 https://api.groq.com https://*.repl.co https://*.replit.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; upgrade-insecure-requests;"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=(), serial=()"
    X-DNS-Prefetch-Control = "on"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    Server = "Nexus-Governance-OS"
    X-Permitted-Cross-Domain-Policies = "none"
    X-Download-Options = "noopen"
    Expect-CT = "enforce, max-age=86400"

[[headers]]
  for = "/**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/**/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/assets/icons/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/x-icon"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Clear-Site-Data = "\"cache\""

[[headers]]
  for = "/hitl-review.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Clear-Site-Data = "\"cache\""

[[headers]]
  for = "/audit-logs.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Clear-Site-Data = "\"cache\""

[[headers]]
  for = "/js/api/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/js/controllers/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/js/components/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/utils/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  port = 3000
  targetPort = 8000
  command = "echo 'Running local development server for static files'"
  publish = "."
  autoLaunch = false
  framework = "#static"

[context.production]
  environment = { NODE_ENV = "production", API_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "development", API_ENV = "staging" }

[context.branch-deploy]
  environment = { NODE_ENV = "development", API_ENV = "development" }