<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | Nexus Governance OS</title>

    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Dashboard for Nexus Enterprise Governance Platform">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 
                            400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 
                            800: '#1e40af', 900: '#1e3a8a', 950: '#172554' 
                        },
                        brand: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['Fira Code', 'Consolas', 'monospace']
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.5s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    </style>
</head>
<body class="h-full w-full flex overflow-hidden bg-gray-50 text-gray-900 antialiased selection:bg-blue-200 selection:text-blue-900">

    <div id="toast-mount"></div>

    <!-- Sidebar Initial Skeleton -->
    <div id="sidebar-mount" class="h-full shrink-0 z-30">
        <aside class="fixed top-0 left-0 z-30 h-screen bg-gray-900 flex flex-col shadow-xl w-64 translate-x-0 hidden lg:flex">
            <div class="h-16 flex items-center justify-between px-4 border-b border-gray-800">
                <a class="flex items-center gap-3 overflow-hidden text-white">
                    <div class="flex-shrink-0 w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg">
                        <svg class="w-6 h-6 text-white"><use href="#icon-dashboard"></use></svg>
                    </div>
                    <span class="font-bold text-lg tracking-tight whitespace-nowrap opacity-100">Nexus OS</span>
                </a>
            </div>
            <nav class="flex-1 py-4 px-3 space-y-2">
                <div class="h-10 bg-gray-800 rounded animate-pulse w-full"></div>
                <div class="h-10 bg-gray-800 rounded animate-pulse w-full"></div>
                <div class="h-10 bg-gray-800 rounded animate-pulse w-full"></div>
                <div class="h-10 bg-gray-800 rounded animate-pulse w-full"></div>
            </nav>
        </aside>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden relative z-0">

        <!-- Header Initial Skeleton -->
        <div id="header-mount" class="shrink-0 z-20">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 lg:px-8 w-full shadow-sm sticky top-0 hidden sm:flex">
                <div class="flex items-center gap-4">
                    <div class="h-6 w-32 bg-gray-200 rounded animate-pulse"></div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="h-8 w-8 bg-gray-200 rounded-full animate-pulse"></div>
                    <div class="h-8 w-8 bg-gray-200 rounded-full animate-pulse"></div>
                    <div class="h-8 w-8 bg-blue-200 rounded-full animate-pulse"></div>
                </div>
            </header>
        </div>

        <!-- Dashboard Layout Skeleton -->
        <main id="dashboard-mount" class="flex-1 overflow-y-auto bg-gray-50 z-10 relative custom-scrollbar">
            <div class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto space-y-6">

                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div>
                        <div class="h-8 w-64 bg-gray-200 rounded animate-pulse mb-2"></div>
                        <div class="h-4 w-96 bg-gray-200 rounded animate-pulse"></div>
                    </div>
                    <div class="h-10 w-24 bg-gray-200 rounded animate-pulse"></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-32 animate-pulse">
                        <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
                        <div class="h-8 bg-gray-200 rounded w-1/2"></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-32 animate-pulse">
                        <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
                        <div class="h-8 bg-gray-200 rounded w-1/2"></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-32 animate-pulse">
                        <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
                        <div class="h-8 bg-gray-200 rounded w-1/2"></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-32 animate-pulse">
                        <div class="h-4 bg-gray-200 rounded w-1/3 mb-4"></div>
                        <div class="h-8 bg-gray-200 rounded w-1/2"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="col-span-1 lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-[300px] animate-pulse">
                        <div class="h-6 bg-gray-200 rounded w-1/4 mb-6"></div>
                        <div class="h-12 bg-gray-100 rounded w-full mb-4"></div>
                        <div class="h-12 bg-gray-100 rounded w-full mb-4"></div>
                        <div class="h-12 bg-gray-100 rounded w-full mb-4"></div>
                    </div>
                    <div class="col-span-1 bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-[300px] animate-pulse">
                        <div class="h-6 bg-gray-200 rounded w-1/2 mb-6"></div>
                        <div class="h-20 bg-gray-100 rounded w-full mb-4"></div>
                        <div class="h-20 bg-gray-100 rounded w-full mb-4"></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-[250px] animate-pulse"></div>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 h-[250px] animate-pulse"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts (Corrected relative paths for FastAPI serving) -->
    <script src="/js/config.js"></script>
    <script src="/js/utils/formatters.js"></script>
    <script src="/js/utils/domUtils.js"></script>
    <script src="/js/utils/validators.js"></script>
    <script src="/js/utils/authStore.js"></script>
    <script src="/js/api/apiClient.js"></script>
    <script src="/js/api/authApi.js"></script>
    <script src="/js/api/dashboardApi.js"></script>
    <script src="/js/components/ToastNotification.js"></script>
    <script src="/js/components/Sidebar.js"></script>
    <script src="/js/components/Header.js"></script>
    <script src="/js/controllers/dashboardController.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                new Sidebar('#sidebar-mount');
                new Header('#header-mount');
                new DashboardController('#dashboard-mount');
            }, 50);
        });
    </script>
</body>
</html>
